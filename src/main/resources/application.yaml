ledger:
  fee-rate: 310
  merchant-directory:
    url: http://localhost:9090
server:
  tomcat:
    accept-count: 100
    max-connections: 8192
spring:
  threads:
    virtual:
      enabled: true   # Tomcat runs each request on its own virtual thread; set to false to roll back
  datasource:
    url: jdbc:postgresql://localhost:5433/ledger
    username: postgres
    password: password
    hikari:
      maximum-pool-size: 10   # HikariCP default, written out because it bounds concurrent queries
  jpa:
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always
