name: build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: java -version and mvnw -v
        run: java -version && ./mvnw -v
      - name: ./mvnw -B verify
        run: ./mvnw -B verify
